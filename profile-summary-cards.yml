# OPTIONAL: puts the analytics cards inside your own repo so they never break.
# Save as:  .github/workflows/profile-summary-cards.yml  (in nagaarunprasath08/nagaarunprasath08)
# Then: Settings > Actions > General > Workflow permissions > "Read and write permissions".
# Run it once from the Actions tab (Run workflow). Cards appear in profile-summary-card-output/github_dark/
# Then in README.md replace the hosted card URLs with, for example:
#   ./profile-summary-card-output/github_dark/0-profile-details.svg
#   ./profile-summary-card-output/github_dark/3-stats.svg
#   ./profile-summary-card-output/github_dark/4-productive-time.svg
#   ./profile-summary-card-output/github_dark/1-repos-per-language.svg
#   ./profile-summary-card-output/github_dark/2-most-commit-language.svg
# Check the action's README for its latest release tag if the version below is outdated:
# https://github.com/vn7n24fzkq/github-profile-summary-cards

name: Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release/v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5.5

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --staged --quiet || git commit -m "Update profile summary cards"
          git push
