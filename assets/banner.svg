<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#021b2b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#8a5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .mono{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}
    .code{fill:#00f0ff;opacity:.16;font-size:14px}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .flow{stroke-dasharray:8 10;animation:flow 2.2s linear infinite}
    .scan{animation:scan 5s linear infinite}
    .cursor{animation:blink 1s steps(1) infinite}
    .float{animation:float 6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-72}}
    @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(340px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow1)"/>
  <rect width="1200" height="320" fill="url(#glow2)"/>

  <!-- background code -->
  <g class="mono code">
    <text x="30" y="40">const stack = ["React","Node","Mongo"];</text>
    <text x="30" y="64">import express from "express";</text>
    <text x="30" y="88">def train(model, data):</text>
    <text x="900" y="250">app.listen(5000);</text>
    <text x="860" y="274">git commit -m "ship it"</text>
    <text x="930" y="298">npm run dev</text>
    <text x="760" y="40">{ mern: true, python: true }</text>
  </g>

  <!-- circuit lines -->
  <g fill="none" stroke="url(#neon)" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path class="flow" d="M0 260H180L220 220H420L450 250H640"/>
    <path class="flow" d="M1200 70H1040L1000 110H820L790 80H700"/>
    <path class="flow" d="M0 150H90L120 180H260"/>
    <path class="flow" d="M1200 200H1120L1090 170H980"/>
  </g>
  <g fill="#00f0ff">
    <circle class="pulse" cx="220" cy="220" r="5"/>
    <circle class="pulse" cx="450" cy="250" r="5" style="animation-delay:.5s"/>
    <circle class="pulse" cx="1000" cy="110" r="5" style="animation-delay:1s"/>
    <circle class="pulse" cx="790" cy="80" r="5" style="animation-delay:1.4s"/>
    <circle class="pulse" cx="120" cy="180" r="5" style="animation-delay:.8s"/>
    <circle class="pulse" cx="1090" cy="170" r="5" style="animation-delay:1.8s"/>
  </g>

  <!-- scan line -->
  <rect class="scan" x="0" y="0" width="1200" height="3" fill="#00f0ff" opacity="0.18" filter="url(#blur)"/>

  <!-- frame corners -->
  <g stroke="#00f0ff" stroke-width="3" fill="none" opacity="0.9">
    <path d="M20 60V20H60"/><path d="M1180 60V20H1140"/>
    <path d="M20 260V300H60"/><path d="M1180 260V300H1140"/>
  </g>

  <!-- text -->
  <g class="float">
    <text class="mono" x="600" y="118" text-anchor="middle" font-size="18" fill="#7df9ff" opacity="0.9">&lt;/&gt; hello_world();</text>
    <text class="mono" x="600" y="180" text-anchor="middle" font-size="58" font-weight="700" fill="url(#neon)">NAGA ARUN PRASATH</text>
    <text class="mono" x="600" y="228" text-anchor="middle" font-size="22" fill="#cfe8ff">Full-Stack Developer <tspan fill="#8a5cff">|</tspan> MERN <tspan fill="#8a5cff">|</tspan> Python<tspan class="cursor" fill="#00f0ff"> █</tspan></text>
  </g>
</svg>
